# Panel fields
CitationNetworkPanel.source.label=Source
CitationNetworkPanel.source.hint=OpenAlex covers both directions. Semantic Scholar can have a reference list withheld by a publisher.
CitationNetworkPanel.source.openalex=OpenAlex
CitationNetworkPanel.source.semanticscholar=Semantic Scholar
CitationNetworkPanel.query.label=Search query
CitationNetworkPanel.query.hint=Leave empty when a work identifier is given below.
CitationNetworkPanel.seed.label=Or one work
CitationNetworkPanel.seed.hint=An OpenAlex identifier such as W3198910543, or a digital object identifier.
CitationNetworkPanel.seedCount.label=Seed works from the search
CitationNetworkPanel.direction.label=Follow
CitationNetworkPanel.direction.citing=Works citing these
CitationNetworkPanel.direction.references=Works cited by these
CitationNetworkPanel.direction.both=Both
CitationNetworkPanel.depth.label=Generations
CitationNetworkPanel.maximum.label=Maximum works
CitationNetworkPanel.neighbours.label=Neighbours per work
CitationNetworkPanel.mailto.label=Your email address
CitationNetworkPanel.mailto.hint=OpenAlex serves a faster pool to requests that carry an address. Optional.
CitationNetworkPanel.apiKey.label=Key for the source
CitationNetworkPanel.apiKey.hint=Optional, and used with whichever source is chosen. A free OpenAlex key removes the rate limit on searches.

